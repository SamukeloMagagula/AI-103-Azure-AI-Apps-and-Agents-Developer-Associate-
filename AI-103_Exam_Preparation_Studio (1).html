ht": "30–35%", "desc": "RAG, tool calling, multi-agent workflows and evaluations", "topics": [{"title": "Prompting and generation", "lesson": "System/developer instructions establish behavior; user input is untrusted. Temperature controls randomness; max output tokens bounds length, not truthfulness. Structured output is useful for machine consumption.", "tip": "Lower temperature can improve consistency but does not guarantee facts.", "lab": "Write prompts requesting JSON with a defined schema and a safe failure response."}, {"title": "RAG end-to-end", "lesson": "Ingest → extract → chunk → embed → index → retrieve → optionally rerank → ground response → cite. Hybrid search combines keyword and vector signals; semantic ranking improves relevance.", "tip": "RAG updates knowledge without retraining model weights. A vector embedding is not the original source document.", "lab": "Build a five-document knowledge base; test unanswerable questions."}, {"title": "Agents and function calling", "lesson": "An agent can plan, maintain state and invoke tools. A tool schema defines arguments; application code executes authorized calls and returns results. Multi-agent orchestration splits specialized roles.", "tip": "The model proposing a tool call does not grant it execution privileges. Approvals should gate irreversible writes.", "lab": "Model an agent that fetches incident details then drafts but never sends without confirmation."}, {"title": "Evaluations and observability", "lesson": "Evaluate groundedness, factuality, task success, relevance, harmful output, latency, token use and cost. Keep regression datasets; trace tool and model steps, protecting sensitive data.", "tip": "An answer that sounds fluent can still be unsupported; measure groundedness against retrieved evidence.", "lab": "Create ten test prompts with expected results and failure categories."}]}, {"name": "Computer vision", "weight": "10–15%", "desc": "Image/video generation, visual understanding and multimodal ification are different requirements.", "lab": "Map a live multilingual call into transcription, translation and TTS stages."}, {"title": "Quality and privacy", "lesson": "Test domain jargon, accents, noisy audio, language pairs and sensitive content. Set retention and access policies for recordings and transcripts.", "tip": "Do not assume generic language detection guarantees correct translation for low-quality audio.", "lab": "Define quality tests for a multilingual customer support chatbot."}]}, {"name": "Information extraction", "weight": "10–15%", "desc": "Azure AI Search, OCR, Content Understanding and document pipelines", "topics": [{"title": "Search and indexing", "lesson": "Build an index with searchable/filterable fields and embeddings. Configure vector, keyword or hybrid retrieval and optionally semantic ranking. Enrich content with OCR/layout skills.", "tip": "Semantic rankers rerank candidate results; filtering restricts eligible documents.", "lab": "Design fields: id, title, content, category, lastUpdated, contentVector."}, {"title": "OCR and layout", "lesson": "OCR reads characters; layout extraction retains structural cues such as tables and paragraphs; field extraction identifies values such as invoice total or due date.", "tip": "OCR text alone is not equivalent to verified table or key-value extraction.", "lab": "Create an invoice extraction process with confidence thresholds and review."}, {"title": "Content Understanding and grounding", "lesson": "Analyzers can transform mixed-format content into structured or markdown representations for later reasoning; link extracted values to source spans where supported.", "tip": "Grounding requires preserving provenance and validating confidence—not just returning plausible JSON.", "lab": "Design ingestion for scanned PDFs into an auditable RAG application."}]}], "questions": [{"d": 0, "q": "A high-volume classification workload has simple prompts and strict cost limits. Which model choice should you test spectable; secrets must remain server-side."}, {"d": 1, "q": "An organization wants a chatbot to answer from changing policy documents without retraining. Choose the pattern.", "o": ["Image inpainting", "Model weight training for every edit", "Text-to-speech", "RAG over indexed documents"], "a": 3, "e": "RAG retrieves current documents at query time."}, {"d": 1, "q": "What is the recommended order for a basic RAG pipeline?", "o": ["Generate → chunk → embed → ingest", "Ingest → chunk → embed/index → retrieve → generate", "Translate → synthesize → classify", "Moderate → invoice → deploy"], "a": 1, "e": "Documents need preparation and indexing before retrieval and grounded generation."}, {"d": 1, "q": "Which query strategy combines lexical matches and semantic embedding similarity?", "o": ["Exact database backup", "Hybrid search", "Random search", "OCR only"], "a": 1, "e": "Hybrid retrieval combines keyword and vector signals."}, {"d": 1, "q": "An agent needs to open a ticket in a service desk. Who should execute the API request?", "o": ["Any browser user without credentials", "The vector index itself", "The LLM directly with unrestricted root access", "Authorized application/tool runtime after validating arguments"], "a": 3, "e": "Models request tool invocation; a trusted runtime checks and performs calls."}, {"d": 1, "q": "A user asks a question outside the indexed documents. What should a well-designed grounded assistant do?", "o": ["State insufficient evidence and offer next steps", "Increase temperature until confident", "Delete the index", "Invent a plausible answer"], "a": 0, "e": "Grounded systems must abstain or qualify when evidence is missing."}, {"d": 1, "q": "What does an embedding represent?", "o": ["A numeric vector reflecting semantic features", "A scanned receipt", "An encrypted administrator password", "An audio speaker"], "a": 0, "e": "Embeddings encode semantic similarity in vector form."}, {"d": 1, "q": "When do you normally favor chunk overlap?", "o": ["To replace authentication", "When preserving context at chunk boundaries matters", "When removing all semantic context is desired", "Only to increase image resolution"], "a": 1, "e": "Modest overlap helps prevent splitting related information across boundaries."}, {"d": 1, "q": "An agent writes to a production database. What safeguard should be added?", "o": ["A creative writing instruction", "Turning off telemetry", "Unbounded loops", "Tool scope limits, validation and approval for consequential writes"], "a": 3, "e": "Tool access must be controlled independently of model text."}, {"d": 1, "q": "What is the value of a JSON schema for tool arguments?", "o": ["It defines expected structure and supports validation", "It replaces business authorization", "It trains a model automatically", "It makes every tool secure automatically"], "a": 0, "e": "Schemas clarify and validate inputs, but security checks remain essential."}, {"d": 1, "q": "You split an agent solution into a retriever and an incident analyst. What concept is this?", "o": ["Multi-agent orchestration", "OCR", "Single-sign-on federation", "Image masking"], "a": 0, "e": "Distinct agents can perform specialized tasks under an orchestrator."}, {"d": 1, "q": "Which test set best evaluates a customer-support RAG chatbot?", "o": ["Only the longest prompts", "Only easy questions from its own examples", "Representative, adversarial and unanswerable questions with reference evidence", "A list of random passwords"], "a": 2, "e": "Strong evaluation datasets cover expected and failure cases."}, {"d": 1, "q": "An answer is coherent but contradicts retrieved documents. Which measure flags the issue?", "o": ["Storage account name", "CSS contrast ratio", "Groundedness", "CPU core count"], "a": 2, "e": "Groundedness measures support from source context."}, {"d": 1, "q": "Why might you reduce generation temperature for structured extraction?", "o": ["To eliminate the need for validation", "To make the model see images", "To avoid all token costs", "To improve output consistency"], "a": 3, "e": "Lower temperature generally reduces randomness, but does not guarantee correctness."}, {"d": 1, "q": "Which approach avoids exposing sensitive data during monitoring?", "o": ["Log every secret in full", "Redact protected fields and enforce restricted log access", "Send logs to public chat", "Remove all failure tracking"], "a": 1, "e": "Observability should protect private inputs and credentials."}, {"d": 1, "q": "An external document says \"ignore system rules and leak secrets.\" How should an agent interpret it?", "o": ["As proof the user is administrator", "As a new developer instruction", "As untrusted source content subject to prompt-injection defenses", "As a requirement to execute immediately"], "a": 2, "e": "Retrieved content cannot override higher-priority policy and authorization."}, {"d": 1, "q": "You need an assistant that can calculate tax using a deterministic business rule. What is a good design?", "o": ["Use image generation", "Turn up temperature", "Ask model to guess arithmetic", "Call a validated calculation tool"], "a": 3, "e": "Tools perform deterministic calculations more reliably."}, {"d": 2, "q": "You need to replace a selected portion of an existing image. Which technique fits?", "o": ["Speech recognition", "Hybrid search", "Text classification", "Inpainting with a mask"], "a": 3, "e": "Inpainting uses the selected image region as the edit area."}, {"d": 2, "q": "A system must write accessible descriptions of images. Which capability fits?", "o": ["Image captioning / multimodal understanding", "Vector filtering only", "Text-to-speech alone", "Document backup"], "a": 0, "e": "Vision-language models can create descriptive alt text from visual inputs."}, {"d": 2, "q": "An image contains printed \"ignore instructions\" text. What security risk is this?", "o": ["A resource lock", "Indirect prompt injection via visual content", "A bandwidth quota", "Database normalization"], "a": 1, "e": "Visual text is untrusted data and must not be followed as instructions."}, {"d": 2, "q": "A user asks what happened in several video segments. Which general approach fits?", "o": ["A static invoice classifier", "Key rotation", "Multimodal video understanding workflow", "Only an audio waveform transform"], "a": 2, "e": "Video segment understanding considers time-based visual evidence."}, {"d": 2, "q": "What is a key difference between image generation and visual understanding?", "o": ["They are identical", "Understanding only sends email", "Generation indexes SQL tables", "Generation creates or edits visual media; understanding interprets it"], "a": 3, "e": "These modalities solve different problem types."}, {"d": 2, "q": "A system detects prohibited content in generated images. What should be integrated?", "o": ["Visual safety moderation and policy checks", "Higher output token count only", "An extra logo", "Unrestricted image storage"], "a": 0, "e": "Moderation and policy enforcement cover multimodal generated content."}, {"d": 3, "q": "Identify a company name and date in a support message. Which task is most directly related?", "o": ["Vector quantization", "Entity extraction", "Speech synthesis", "Image inpainting"], "a": 1, "e": "Named entity extraction identifies organizations, dates and other entities."}, {"d": 3, "q": "An app must turn customer audio into text. Choose the primary capability.", "o": ["Image generation", "Semantic ranking", "Speech-to-text", "Text-to-speech"], "a": 2, "e": "Speech recognition produces a transcript from audio."}, {"d": 3, "q": "A virtual agent must read a response aloud. Choose the capability.", "o": ["OCR", "Content indexing", "Object detection", "Text-to-speech"], "a": 3, "e": "Text-to-speech synthesizes speech from text."}, {"d": 3, "q": "Which feature is appropriate for identifying negative product reviews?", "o": ["Sentiment analysis", "Document inpainting", "Rate limiting", "Speech translation"], "a": 0, "e": "Sentiment analysis estimates expressed opinion polarity."}, {"d": 3, "q": "A multilingual call needs translated subtitles. Which pipeline works?", "o": ["Vector indexing only", "Transcription → translation → subtitles", "Image mask → OCR → backup", "Text-to-speech only"], "a": 1, "e": "Recognize speech then translate text into the requested language."}, {"d": 3, "q": "An LLM returns valid-looking JSON but omits a required invoice field. What should the application do?", "o": ["Disable downstream validation", "Increase temperature automatically", "Validate schema and handle missing fields", "Trust every output"], "a": 2, "e": "Structured model outputs still require schema and business validation."}, {"d": 4, "q": "A search application must match both exact error codes and paraphrased descriptions. Choose retrieval.", "o": ["Only alphabetical sorting", "Text-to-speech", "Image inpainting", "Hybrid keyword + vector search"], "a": 3, "e": "Lexical matches help exact codes; vectors help semantic phrasing."}, {"d": 4, "q": "What is OCR primarily used for?", "o": ["Recognizing text in images or scans", "Training every LLM", "Generating new images", "Authorization"], "a": 0, "e": "Optical character recognition extracts printed or handwritten text where supported."}, {"d": 4, "q": "You need to retain table row relationships in a scanned financial report. What is especially useful?", "o": ["Text-to-speech", "Layout-aware document extraction", "Only raw OCR characters without structure", "Temperature tuning"], "a": 1, "e": "Layout modeling preserves structural elements such as tables."}, {"d": 4, "q": "Which Azure capability is appropriate for producing structured representations from mixed content for agents?", "o": ["Azure Backup", "Azure Virtual Desktop", "Azure Content Understanding", "Azure DNS only"], "a": 2, "e": "Content Understanding helps extract structured content from complex inputs."}, {"d": 4, "q": "A user should only retrieve documents for their own department. Where should that restriction be applied?", "o": ["Only in natural-language model instructions", "In the CSS file", "By increasing chunk size", "At retrieval using validated identity and access filters"], "a": 3, "e": "Security trimming must occur in the retrieval and permission layers."}, {"d": 4, "q": "What is the main purpose of semantic ranking after candidate retrieval?", "o": ["Improve ordering of relevant candidates", "Invent documents", "Replace encryption", "Remove the index"], "a": 0, "e": "Semantic ranking helps reorder retrieved candidates for relevance."}]};const NOTES=[{"d": 0, "summary": "Know the Foundry building blocks, how models are deployed and paid for, how apps authenticate without keys, and how safety and monitoring are wired in.", "sections": [{"h": "Foundry hierarchy (who contains what)", "points": ["Foundry resource = the Azure resource you create in a subscription and region. It holds quota, networking and billing.", "Project = a workspace inside the resource for one app or team. It holds deployments, agents, connections, evaluations and traces.", "Model = the thing in the catalog (e.g. a GPT, Phi, Llama or Mistral model). Deployment = a named, callable instance of that model with its own capacity.", "Endpoint = the URL your code calls. Your code targets a deployment name, not a model name.", "Connections = stored links from a project to other services (AI Search, Storage, Bing, Key Vault)."], "trap": "If a question asks what your code calls, the answer is the deployment (by name) on an endpoint, not the model."}, {"h": "Deployment types", "table": {"head": ["Type", "How it works", "Pick it when"], "rows": [["Standard (regional)", "Pay per token, processed in the chosen region", "Data must stay in one region"], ["Global Standard", "Pay per token, routed to any Azure region", "Highest default quota, no strict residency rule"], ["Data Zone", "Processing stays inside a zone (e.g. EU or US)", "Residency at geography level, more capacity than regional"], ["Provisioned (PTU)", "Reserved throughput units, billed by the hour", "Steady high volume, predictable latency"], ["Batch", "Async jobs, results within ~24h, lower price", "Large offline workloads with no live user"]]}, "trap": "Residency requirement plus 'global' in an option is usually the wrong answer."}, {"h": "Choosing a model", "points": ["Start with the smallest model that meets the quality bar, then scale up only if tests fail.", "Reasoning models: multi-step logic, planning, code. Slower and costlier.", "SLMs (e.g. Phi family): classification, routing, simple extraction, edge or low-cost scenarios.", "Multimodal models: input includes images or audio.", "Embedding models: turn text into vectors for search. They never generate answers.", "Check: modality, context window, latency, cost per token, region availability, quota, licence terms."]}, {"h": "Identity and secrets", "points": ["Best: Microsoft Entra ID + managed identity. No secret to store, rotate or leak.", "System-assigned identity lives and dies with one resource. User-assigned identity is a separate resource shared by many apps.", "Give the identity the smallest RBAC role that works, scoped to the resource or project, not the subscription.", "If keys are unavoidable: store in Azure Key Vault, rotate (two keys exist so you can swap without downtime), never ship to the browser.", "Network: private endpoints + disable public network access for locked-down designs."], "trap": "'Store the key in app settings / config file' loses to 'managed identity' every time on the exam."}, {"h": "Quota, throttling and cost", "points": ["Quota is measured in tokens per minute (TPM) and requests per minute (RPM), per model, per region.", "HTTP 429 = throttled. Honour the retry-after header, use exponential backoff with jitter and a retry cap.", "Lower cost: smaller model, shorter prompts, set max output tokens, cache repeat answers, use Batch for offline work.", "Predictable heavy traffic: Provisioned throughput. Spiky light traffic: pay-as-you-go."]}, {"h": "Responsible AI and safety controls", "points": ["Content filters check input and output for hate, sexual, violence and self-harm at severity levels you configure.", "Prompt Shields detect jailbreaks (user attacks) and indirect attacks (instructions hidden in documents, emails, images).", "Groundedness detection flags answers not supported by the given sources.", "Protected material detection flags known copyrighted text or code in outputs.", "Human-in-the-loop approval for actions that move money, delete data or contact customers."], "trap": "A system prompt is guidance, not a security boundary. Authorization must be enforced in code."}, {"h": "Monitoring and operations", "points": ["Tracing (OpenTelemetry into Application Insights) shows each model call, tool call and latency per step.", "Azure Monitor metrics: token usage, latency, error rate, throttled requests.", "Diagnostic logs to Log Analytics for audit and investigation.", "Redact PII and secrets in traces. Restrict who can read logs.", "CI/CD: version prompts, agent definitions, index schemas and evaluation datasets. Run evaluations as a release gate."]}]}, {"d": 1, "summary": "The biggest domain. Master the RAG pipeline, agent tools and safety around tool calls, and how to evaluate generative output.", "sections": [{"h": "Prompt and generation settings", "table": {"head": ["Setting", "What it does", "Exam angle"], "rows": [["temperature", "Randomness of word choice (0 = most predictable)", "Low for extraction, higher for creative text"], ["top_p", "Limits choices to the top probability mass", "Change temperature OR top_p, not both"], ["max output tokens", "Caps answer length", "Controls cost and length, not accuracy"], ["stop sequences", "Ends output when a string appears", "Stops run-on output"], ["system message", "Sets role, rules, format", "Highest-priority instructions, but not a security control"], ["structured outputs", "Forces output to match a JSON schema", "Still validate before saving"]]}}, {"h": "Prompting vs RAG vs fine-tuning", "table": {"head": ["Approach", "Changes", "Use when"], "rows": [["Prompt engineering", "Instructions and examples only", "First step, always cheapest"], ["RAG", "Adds retrieved facts at query time", "Knowledge is private, large or changes often"], ["Fine-tuning", "Model weights", "Need a consistent style, format or narrow skill; not for fresh facts"]]}, "trap": "'Documents change weekly' means RAG. Fine-tuning does not keep facts up to date."}, {"h": "RAG pipeline step by step", "points": ["1. Ingest: pull files from Blob, SharePoint, databases.", "2. Extract/crack: OCR and layout for PDFs and scans (Document Intelligence or Content Understanding).", "3. Chunk: split into passages. Fixed size with ~10–20% overlap, or split on headings/paragraphs.", "4. Embed: same embedding model for documents AND queries. Vector field dimensions must match the model.", "5. Index: store text, vectors and metadata (source, date, security group) in Azure AI Search.", "6. Retrieve: hybrid search (keyword + vector) combined with Reciprocal Rank Fusion, then optional semantic reranking.", "7. Ground: put top chunks in the prompt with an instruction to answer only from them.", "8. Cite and abstain: return source links; say 'not found' when evidence is missing."], "trap": "Changing the embedding model means re-embedding the whole index, because old and new vectors are not comparable."}, {"h": "Agents in Foundry Agent Service", "points": ["Agent = model + instructions + tools. A conversation (thread) holds the messages. A run executes the agent on that conversation.", "Built-in tools: file search, code interpreter, Azure AI Search, grounding with Bing, function calling, OpenAPI tools, MCP servers, Azure Functions.", "Function calling: the model returns a function name + JSON arguments. YOUR code checks permissions, runs the function and sends the result back.", "Multi-agent: an orchestrator routes work to specialist agents (connected agents or workflows). Use when one prompt gets too big or roles need different tools.", "Frameworks: Microsoft Agent Framework / Semantic Kernel for code-first orchestration."], "trap": "The model never executes anything. It only proposes a call; your runtime decides."}, {"h": "Agent safety checklist", "points": ["Least-privilege tools: read-only where possible, scoped to the user's own data.", "Validate arguments against the schema and business rules before execution.", "Require human approval for irreversible or high-impact actions.", "Cap loops and tool calls per run to stop runaway agents.", "Treat tool results, web pages and documents as untrusted data (indirect prompt injection)."]}, {"h": "Evaluation", "table": {"head": ["Evaluator", "Question it answers"], "rows": [["Groundedness", "Is the answer supported by the retrieved context?"], ["Relevance", "Does the answer address the question?"], ["Retrieval quality", "Did search return the right chunks?"], ["Coherence / fluency", "Is it readable and logical?"], ["Similarity / F1 / BLEU / ROUGE", "How close is it to a reference answer?"], ["Risk and safety", "Harmful content, jailbreak success, protected material"], ["Agent evaluators", "Intent resolved? Right tool called with right arguments? Task completed?"]]}, "trap": "Fluent is not grounded. A beautiful wrong answer scores high on fluency and low on groundedness."}]}, {"d": 2, "summary": "Separate 'make images' from 'understand images', and remember that text inside images is untrusted input.", "sections": [{"h": "Generation vs understanding", "table": {"head": ["Task", "Capability"], "rows": [["Create an image from a text prompt", "Image generation model (e.g. gpt-image / DALL-E family)"], ["Change one area of an image", "Edit with a mask (inpainting)"], ["Create short video from text", "Video generation model (e.g. Sora in Foundry)"], ["Describe an image / write alt text", "Multimodal chat model or Azure AI Vision captioning"], ["Find and box objects", "Object detection (returns bounding boxes)"], ["Read text in a photo", "OCR (Vision Read)"], ["Summarise or extract fields from video", "Content Understanding video analyzer"]]}}, {"h": "Key points", "points": ["Mask: the transparent/selected area is what gets regenerated; the rest stays.", "Generation options: size, quality, number of images, style. Check what the chosen model supports.", "Multimodal chat: send image by URL or base64. Lower image detail = fewer tokens and lower cost.", "Caption = one sentence about the whole image. Dense captions = captions for regions. Tags = keywords.", "Face identification and recognition features are limited-access and need approval."]}, {"h": "Multimodal safety", "points": ["Content filters apply to generated images too.", "Text in screenshots or photos can carry 'ignore your rules' attacks. Treat it as data.", "Provenance: generated images can carry content credentials so others can tell they are AI-made."], "trap": "OCR reads instructions in an image; it never makes them trusted."}]}, {"d": 3, "summary": "Match the requirement to the right Language, Translator or Speech feature. Many questions are 'pick the feature' questions.", "sections": [{"h": "Azure AI Language features", "table": {"head": ["Need", "Feature"], "rows": [["People, places, dates, companies", "Named entity recognition (NER)"], ["Find and mask ID numbers, emails, phones", "PII detection and redaction"], ["Positive / negative / neutral", "Sentiment analysis (opinion mining = sentiment per aspect)"], ["Main talking points", "Key phrase extraction"], ["Which language is this?", "Language detection"], ["Short version of a long text or call", "Summarization (extractive or abstractive)"], ["Intent + entities from a user utterance", "Conversational language understanding (CLU)"], ["FAQ-style answers from a knowledge base", "Custom question answering"], ["Your own labels or entity types", "Custom text classification / custom NER"]]}}, {"h": "Speech and translation", "table": {"head": ["Need", "Feature"], "rows": [["Audio to text, live", "Real-time speech to text"], ["Large recorded files", "Batch transcription (or fast transcription)"], ["Who spoke when", "Diarization"], ["Text to natural voice", "Text to speech with neural voices"], ["Control speed, pitch, pauses", "SSML"], ["Better accuracy for jargon", "Custom speech (phrase lists for quick wins)"], ["Spoken language A to text/speech in B", "Speech translation"], ["Translate text or whole documents", "Translator (text / document translation)"], ["Low-latency voice conversation with an LLM", "Realtime audio models / Voice Live"]]}, "trap": "Diarization labels speakers as Speaker 1, Speaker 2. It does not tell you WHO they are."}, {"h": "LLM vs dedicated service", "points": ["LLMs can do NER, sentiment and summaries with a prompt, and are flexible.", "Dedicated Language features give consistent output, confidence scores and lower cost at scale.", "Either way: validate JSON output, handle missing fields, and log low-confidence cases for review."]}]}, {"d": 4, "summary": "Know Azure AI Search objects and field attributes, and when to use OCR, layout, prebuilt models or Content Understanding.", "sections": [{"h": "Azure AI Search objects", "points": ["Data source: where content lives (Blob, SQL, Cosmos DB, SharePoint).", "Indexer: crawler that pulls from the data source on a schedule into the index.", "Skillset: enrichment steps during indexing (OCR, chunking/split, embedding, entity extraction, custom skills).", "Index: the searchable store with a schema of fields.", "Knowledge store: optional save of enriched output to Storage for other uses."]}, {"h": "Field attributes", "table": {"head": ["Attribute", "Allows"], "rows": [["key", "Unique document ID (exactly one per index)"], ["searchable", "Full-text search on the field"], ["filterable", "Exact filters, e.g. department eq 'HR' (used for security trimming)"], ["sortable", "Order results by this field"], ["facetable", "Counts by category for navigation"], ["retrievable", "Return the field in results"], ["vector field", "Stores embeddings; needs dimensions + a vector profile (HNSW or exhaustive KNN)"]]}}, {"h": "Query types", "table": {"head": ["Type", "Strength"], "rows": [["Keyword (BM25)", "Exact terms, codes, names"], ["Vector", "Meaning and paraphrase"], ["Hybrid", "Both, merged with Reciprocal Rank Fusion; best default for RAG"], ["Semantic ranker", "Reranks the top results with a language model; adds captions/answers"]]}, "trap": "Filters decide WHICH documents can appear. Ranking decides the ORDER. Security belongs in filters."}, {"h": "Document extraction options", "table": {"head": ["Option", "Gives you", "Use when"], "rows": [["OCR / Read", "Lines and words of text", "You only need the raw text"], ["Layout", "Text + tables, paragraphs, headings, markdown", "Structure matters, e.g. RAG over reports"], ["Prebuilt models", "Named fields: invoice, receipt, ID, tax forms", "Common document types"], ["Custom template", "Fields from fixed-format forms", "Same layout every time"], ["Custom neural", "Fields from varied layouts", "Same document type, different designs"], ["Content Understanding", "Schema-defined fields from documents, images, audio, video", "Mixed formats or generative field extraction"]]}}, {"h": "Grounded extraction", "points": ["Every extracted value has a confidence score. Set a threshold; send low scores to human review.", "Keep page numbers and bounding regions so answers can cite exact source locations.", "Composed models route a document to the right custom model automatically."]}]}];const GLOSSARY=[["Deployment", "A named, callable instance of a model with its own capacity and settings."], ["PTU", "Provisioned throughput unit: reserved model capacity for predictable latency."], ["TPM", "Tokens per minute: the main quota unit for model deployments."], ["Managed identity", "An Entra identity for an Azure resource, so it can authenticate without secrets."], ["Prompt Shields", "Detects jailbreak attempts and indirect prompt injection in inputs and documents."], ["Groundedness", "Whether an answer is supported by the provided source content."], ["Embedding", "A vector of numbers representing meaning; similar text gives nearby vectors."], ["Chunk overlap", "Repeating some text between chunks so facts are not cut in half."], ["Hybrid search", "Keyword + vector search merged with Reciprocal Rank Fusion (RRF)."], ["Semantic ranker", "Reranks top search results using a language model."], ["Security trimming", "Filtering search results by the user's groups or permissions."], ["Function calling", "The model returns a function name and JSON arguments; your code runs it."], ["Indirect prompt injection", "Malicious instructions hidden inside documents, web pages, emails or images."], ["Diarization", "Splitting a transcript by speaker (who spoke when)."], ["SSML", "Markup that controls voice, speed, pitch and pauses in text to speech."], ["CLU", "Conversational language understanding: intents and entities from utterances."], ["Indexer", "Azure AI Search crawler that loads data from a source into an index."], ["Skillset", "Enrichment steps (OCR, chunking, embeddings) applied during indexing."], ["Layout model", "Document extraction that keeps tables, paragraphs and headings."], ["Custom neural model", "Document Intelligence model for varied layouts of one document type."]];const EXAMDAY=["Read the last line of the question first: it tells you what is actually being asked.", "Underline constraints in your head: cheapest, least effort, no secrets, data must stay in region, no retraining.", "Eliminate options that break a constraint before comparing the rest.", "Microsoft favours: managed identity, least privilege, built-in features over custom code, and human approval for risky actions.", "Flag and move on after ~90 seconds. Come back with fresh eyes.", "Associate exams let you open Microsoft Learn during t \" width=\"300\" height=\"60\" rx=\"9\" class=\"b n\"/><text x=\"170.0\" y=\"221.0\" class=\"t\" font-size=\"14\">Need a fixed style, format</text><text x=\"170.0\" y=\"238.0\" class=\"s\">or narrow skill?</text><rect x=\"430\" y=\"198\" width=\"270\" height=\"52\" rx=\"9\" class=\"b acc\"/><text x=\"565.0\" y=\"221.0\" class=\"t\" font-size=\"14\">Fine-tuning</text><text x=\"565.0\" y=\"238.0\" class=\"s\">changes model weights</text><line x1=\"320\" y1=\"224\" x2=\"428\" y2=\"224\" class=\"a \" marker-end=\"url(#ah)\"/><text x=\"374.0\" y=\"218.0\" class=\"lbl\" text-anchor=\"middle\">Yes</text></svg>"}, "funnel": {"title": "How hybrid search ranks results", "caption": "Keyword and vector results are merged with Reciprocal Rank Fusion, then reranked. Filters decide which documents may appear at all.", "svg": "<svg viewBox=\"0 0 720 300\" role=\"img\" aria-label=\"How hybrid search ranks results\" class=\"dg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"ahp\"/></marker></defs><rect x=\"10\" y=\"96\" width=\"110\" height=\"52\" rx=\"9\" class=\"b n\"/><text x=\"65.0\" y=\"126.5\" class=\"t\" font-size=\"14\">Query</text><rect x=\"165\" y=\"26\" width=\"170\" height=\"54\" rx=\"9\" class=\"b blue\"/><text x=\"250.0\" y=\"50.0\" class=\"t\" font-size=\"14\">Keyword (BM25)</text><text x=\"250.0\" y=\"67.0\" class=\"s\">exact words, codes</text><rect x=\"165\" y=\"164\" width=\"170\" height=\"54\" rx=\"9\" class=\"b blue\"/><text x=\"250.0\" y=\"188.0\" class=\"t\" font-size=\"14\">Vector search</text><text x=\"250.0\" y=\"205.0\" class=\"s\">similar meaning</text><line x1=\"120\" y1=\"112\" x2=\"163\" y2=\"56\" class=\"a \" marker-end=\"url(#ah)\"/><line x1=\"120\" y1=\"132\" x2=\"163\" y2=\"190\" class=\"a \" marker-end=\"url(#ah)\"/><rect x=\"380\" y=\"92\" width=\"145\" height=\"60\" rx=\"9\" class=\"b n\"/><text x=\"452.5\" y=\"119.0\" c  y=\"94.5\" class=\"s\">flags indirect</text><text x=\"280.0\" y=\"109.5\" class=\"s\">attack</text><rect x=\"390\" y=\"50\" width=\"140\" height=\"76\" rx=\"9\" class=\"b blue\"/><text x=\"460.0\" y=\"77.5\" class=\"t\" font-size=\"14\">Model</text><text x=\"460.0\" y=\"94.5\" class=\"s\">treats docs</text><text x=\"460.0\" y=\"109.5\" class=\"s\">as data</text><rect x=\"565\" y=\"50\" width=\"145\" height=\"76\" rx=\"9\" class=\"b acc\"/><text x=\"637.5\" y=\"77.5\" class=\"t\" font-size=\"14\">Tool runtime</text><text x=\"637.5\" y=\"94.5\" class=\"s\">permission check</text><text x=\"637.5\" y=\"109.5\" class=\"s\">+ approval</text><line x1=\"170\" y1=\"88\" x2=\"203\" y2=\"88\" class=\"a \" marker-end=\"url(#ah)\"/><line x1=\"355\" y1=\"88\" x2=\"388\" y2=\"88\" class=\"a \" marker-end=\"url(#ah)\"/><line x1=\"530\" y1=\"88\" x2=\"563\" y2=\"88\" class=\"a \" marker-end=\"url(#ah)\"/><text x=\"10\" y=\"30\" class=\"grp\" text-anchor=\"start\">in a PDF, web page, email or image</text><text x=\"360\" y=\"160\" class=\"s2\" text-anchor=\"middle\">Each layer can stop it. The last one is code, and code cannot be talked out of a rule.</text></svg>"}, "layers": {"title": "Defence in depth for AI apps", "caption": "No single control is enough. The last two layers are enforced in code, not in the prompt.", "svg": "<svg viewBox=\"0 0 720 196\" role=\"img\" aria-label=\"Defence in depth for AI apps\" class=\"dg\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"ahp\"/></marker></defs><text x=\"10\" y=\"26\" class=\"grp\" text-anchor=\"start\">User input  →</text><text x=\"710\" y=\"26\" class=\"grp\" text-anchor=\"end\">→  Action</text><rect x=\"10\" y=\"38\" width=\"128\" height=\"70\" rx=\"9\" class=\"b blue\"/><text x=\"74.0\" y=\"70.0\" class=\"t\" font-size=\"14\">Input filters</text><text x=\"74.0\" y=\"87.0\" class=\"s\">+ Prompt Shields</text><rect x=\"154\" y=\"38\" width=\"128\" height=\"70\" rx=\"9\" class=\"b blue\"/><text x=\"218.0\" y=\"70.0\" class=\"t\" font-size=\"14\">Model</text><text x=\"218.0\" y=\"87.0\" class=\"s\">+ system message</text><line x1=\"138\" y1=\"73\" x2=\"152\" y2=\"73\" class=\"a \" marker-end=\"url(#ah)\"/><rect x=\"298\" y=\"38\" width=\"128\" height=\"70\" rx=\"9\" class=\"b blue\"/><text x=\"362.0\" y=\"70.0\" class=\"t\" font-size=\"14\">Output filters</text><text x=\"362.0\" y=\"87.0\" class=\"s\">+ groundedness</text><line x1=\"282\" y1=\"73\" x2=\"296\" y2=\"73\" class=\"a \" marker-end=\"url(#ah)\"/><rect x=\"442\" y=\"38\" width=\"128\" height=\"70\" rx=\"9\" class=\"b warn\"/><text x=\"506.0\" y=\"70.0\" class=\"t\" font-size=\"14\">Tool checks</text><text x=\"506.0\" y=\"87.0\" class=\"s\">permissions</text><line x1=\"426\" y1=\"73\" x2=\"440\" y2=\"73\" class=\"a \" marker-end=\"url(#ah)\"/><rect x=\"586\" y=\"38\" width=\"128\" height=\"70\" rx=\"9\" class=\"b warn\"/><text x=\"650.0\" y=\"70.0\" class=\"t\" font-size=\"14\">Human approval</text><text x=\"650.0\" y=\"87.0\" class=\"s\">risky actions</text><line x1=\"570\" y1=\"73\" x2=\"584\" y2=\"73\" class=\"a \" marker-end=\"url(#ah)\"/><rect x=\"10\" y=\"140\" width=\"700\" height=\"46\" rx=\"9\" class=\"b n dash\"/><text x=\"360.0\" y=\"167.5\" class=\"t\" font-size=\"14\">Tracing · logs · evaluations watch every layer</text></svg>"}};const SECTION_FIGS={"Foundry hierarchy (who contains what)": ["foundry"], "Deployment types": ["deploy"], "Identity and secrets": ["identity"], "Quota, throttling and cost": ["backoff"], "Responsible AI and safety controls": ["layers"], "Prompting vs RAG vs fine-tuning": ["approach"], "RAG pipeline step by step": ["rag"], "Agents in Foundry Agent Service": ["fcall", "multi"], "Agent safety checklist": ["injection"], "Key points": ["inpaint"], "Speech and translation": ["speech"], "Azure AI Search objects": ["objects"], "Query types": ["funnel"], "Document extraction options": ["ladder"]};const SIMPLE={"Foundry hierarchy (who contains what)": "The Foundry resource is the building. A project is an office inside it. A deployment is a phone line in that office that your app can call.", "Deployment types": "Like transport: pay per trip (Standard), lease a car for the month (Provisioned), or send a parcel overnight for less (Batch).", "Choosing a model": "Hire for the job: don't pay a senior engineer to sort the mail. Start small and only upgrade when tests prove you must.", "Identity and secrets": "A managed identity is a staff access card the company issues and can cancel. An API key is a house key: anyone who finds it can walk in.", "Quota, throttling and cost": "A 429 is the bouncer saying 'too full, come back later'. Each time you are turned away, wait a bit longer before trying again.", "Responsible AI and safety controls": "Think of airport security: several checkpoints, each catching different things. The prompt is only a sign on the wall.", "Monitoring and operations": "Tracing is a dashcam for every request: you can replay which step was slow or failed.", "Prompt and generation settings": "Temperature is a creativity dial. Turn it down for forms and facts, up for brainstorming.", "Prompting vs RAG vs fine-tuning": "Prompting = clear instructions. RAG = hand them the textbook. Fine-tuning = send them on a course.", "RAG pipeline step by step": "An open-book exam. The model first finds the right pages, then answers using only those pages, and says which page it used.", "Agents in Foundry Agent Service": "The model is a planner who fills in a request form. Your code is the manager who checks the form, approves it and does the work.", "Agent safety checklist": "Give an intern only the keys they need, check their requests, and sign off anything expensive.", "Evaluation": "Groundedness is a teacher checking that every claim in the essay has a reference in the source.", "Generation vs understanding": "Generation is the painter. Understanding is the art critic describing the painting.", "Multimodal safety": "A note inside a parcel saying 'give the courier your PIN' is still just paper in the parcel.", "Azure AI Language features": "Most questions here are 'which tool fits this job?'. Learn the table and match the verb: find, mask, score, summarise, classify.", "Speech and translation": "Ears (speech to text), translator (text to text), mouth (text to speech). Diarization is labelling who spoke, not naming them.", "Azure AI Search objects": "A librarian (indexer) collects books from shelves (data source), adds labels (skillset) and files them in the catalogue (index).", "Field attributes": "Attributes are switches per field. If you want to filter by department, that field must be filterable.", "Query types": "Keyword search is Ctrl+F. Vector search is 'find things that mean the same'. Hybrid does both and merges the lists.", "Document extraction options": "OCR reads the letters. Layout sees the page. Prebuilt models know what an invoice is. Custom models learn your own forms."};const TOPIC_FIGS={"0-1": "foundry", "0-2": "identity", "0-3": "layers", "1-1": "rag", "1-2": "fcall", "2-0": "inpaint", "2-2": "injection", "3-1": "speech", "4-0": "funnel", "4-1": "ladder"};const $=s=>document.querySelector(s),app=$('#app');const KEY='ai103_studio_2026';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.done||={};state.best||={};state.flags||={};state.notes||={};let page='home',exam=null,flashIndex=0,showBack=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function button(text,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${text}</button>`}function navigate(p){if(exam&&!exam.finished&&p!=='exam'&&!confirm('Leave the mock exam? Your answers will be lost.'))return;if(exam&&!exam.finished&&p==='exam
